<!-- Lec-10 :- Form-Submissions in ExpressJS ("public"->index.html & app.js)  -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home Page</title>
    </head>
    <body>
        <h1>Home Page</h1> 
        <!-- By default, form tag sends GET request to the action. It will send as query parameters 
            (in which URL, you have to submit your data -> "action" attribute)  -->
        <form action="/contact" method="post">
            <div> 
                <label for="name">Name : </label> 
                <!-- <input type="text" name="name" id="name" />   -->
                <input type="text" name="user[name]" id="name" />
            </div>
            <div>
                <label for="message">Message : </label>
                <!-- <input name="message" id="message" placeholder="Write your message here" />  -->
                <input name="user[message]" id="message" placeholder="Write your message here" />
            </div>
            <button>Submit</button>
         </form>
    </body>
</html>
